<!doctype html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gestión Salud y Deporte{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Gestión Salud y Deporte</a>
    <nav>
      <a href="/">Panel</a>
      <a href="/eventos">Eventos</a>
      <a href="/importar">Importar foto</a>
